[package]
name = "egress"
version = "0.0.0"
edition = "2024"
authors = ["slipmesh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slipmesh/egress"
# Ships as an image, never to crates.io.
publish = false
description = "The egress agent: resolves each Egress list on the nodes it names and routes it out through them"

[[bin]]
name = "egress"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
# Each answer's TTL, which tokio's lookup gives none of.
hickory-resolver = "0.26.4"
# The Kubernetes version the agent is built for, and `Condition`'s schema.
k8s-openapi = { version = "0.29.0", features = ["schemars", "v1_37"] }
kube = { version = "5.2.0", default-features = false, features = ["client", "derive", "rustls-tls", "aws-lc-rs", "runtime"] }
# Every list's queries at once, the first failure ending them all.
futures = "0.3.34"
# aws-lc-rs: one provider for this client and kube's.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
prometheus-client = "0.26.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# The derive's code names it.
serde_json = "1.0.154"
sliplib-kube = { git = "https://github.com/slipmesh/sliplib", tag = "v0.28.1" }
sliplib-net = { git = "https://github.com/slipmesh/sliplib", tag = "v0.28.1" }
sliplib-runtime = { git = "https://github.com/slipmesh/sliplib", tag = "v0.28.1", features = ["metrics"] }
sliplib-yaml = { git = "https://github.com/slipmesh/sliplib", tag = "v0.28.1" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
kube = { version = "5.2.0", default-features = false, features = ["cel", "derive"] }
