[package]
name = "egress"
version = "0.0.0"
edition = "2024"
authors = ["slipmesh"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/slipmesh/egress"
# Ships as an image, never to crates.io.
publish = false
default-run = "egress"
description = "The egress agent: resolves each Egress list on the nodes it names and routes it out through them"

[[bin]]
name = "egress"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
# Each answer's TTL, which tokio's lookup gives none of.
hickory-resolver = "0.26.4"
# The Kubernetes version the agent is built for, and `Condition`'s schema.
k8s-openapi = { version = "0.29.0", features = ["schemars", "v1_37"] }
kube = { version = "5.2.0", default-features = false, features = ["derive"] }
# Every list's queries at once, the first failure ending them all.
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }
# aws-lc-rs: one provider for this client and kube's.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# The last release that reads format version 1, for `egress-export` alone.
sliplib-config-v1 = { package = "sliplib-config", git = "https://github.com/slipmesh/sliplib", tag = "v0.19.0" }
sliplib-net-v1 = { package = "sliplib-net", git = "https://github.com/slipmesh/sliplib", tag = "v0.19.0" }
# The derive's code names it.
serde_json = "1.0.154"
sliplib-net = { git = "https://github.com/slipmesh/sliplib", tag = "v0.28.0" }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
kube = { version = "5.2.0", default-features = false, features = ["cel", "derive"] }
