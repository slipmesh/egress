apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egresses.slipmesh.net
spec:
  group: slipmesh.net
  names:
    kind: Egress
    plural: egresses
    singular: egress
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodes
      name: Nodes
      type: string
    - jsonPath: .spec.install
      name: Install
      type: boolean
    - jsonPath: .spec.ttl
      name: TTL
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: One list of networks, resolved and routed out through the exit nodes it names
        properties:
          spec:
            description: 'Read strictly: a new field reaches the agents before any CR carries it.'
            properties:
              exclude:
                items:
                  description: One kind of source alone; a `label` keeps its networks from merging with another label's.
                  properties:
                    asns:
                      items:
                        maxLength: 12
                        type: string
                      maxItems: 1000
                      type: array
                    country:
                      description: ISO 3166-1 alpha-2.
                      maxLength: 2
                      type: string
                    hostnames:
                      items:
                        maxLength: 253
                        type: string
                      maxItems: 1000
                      type: array
                    label:
                      maxLength: 63
                      type: string
                    prefixes:
                      items:
                        maxLength: 43
                        type: string
                      maxItems: 1000
                      type: array
                    ttl:
                      description: Seconds every answer of this source holds, over the list's `ttl` and a host record's own.
                      format: uint32
                      minimum: 0.0
                      type: integer
                  type: object
                  x-kubernetes-validations:
                  - rule: '[has(self.asns), has(self.prefixes), has(self.country), has(self.hostnames)].filter(x, x).size() == 1'
                  - rule: '!has(self.asns) || (size(self.asns) > 0 && self.asns.all(a, a.matches(''^AS[0-9]+$'')))'
                  - rule: '!has(self.prefixes) || (size(self.prefixes) > 0 && self.prefixes.all(p, isCIDR(p)))'
                  - rule: '!has(self.country) || self.country.matches(''^[A-Za-z]{2}$'')'
                  - rule: '!has(self.hostnames) || size(self.hostnames) > 0'
                  - rule: '!has(self.ttl) || self.ttl >= 1'
                maxItems: 100
                type: array
              include:
                items:
                  description: One kind of source alone; a `label` keeps its networks from merging with another label's.
                  properties:
                    asns:
                      items:
                        maxLength: 12
                        type: string
                      maxItems: 1000
                      type: array
                    country:
                      description: ISO 3166-1 alpha-2.
                      maxLength: 2
                      type: string
                    hostnames:
                      items:
                        maxLength: 253
                        type: string
                      maxItems: 1000
                      type: array
                    label:
                      maxLength: 63
                      type: string
                    prefixes:
                      items:
                        maxLength: 43
                        type: string
                      maxItems: 1000
                      type: array
                    ttl:
                      description: Seconds every answer of this source holds, over the list's `ttl` and a host record's own.
                      format: uint32
                      minimum: 0.0
                      type: integer
                  type: object
                  x-kubernetes-validations:
                  - rule: '[has(self.asns), has(self.prefixes), has(self.country), has(self.hostnames)].filter(x, x).size() == 1'
                  - rule: '!has(self.asns) || (size(self.asns) > 0 && self.asns.all(a, a.matches(''^AS[0-9]+$'')))'
                  - rule: '!has(self.prefixes) || (size(self.prefixes) > 0 && self.prefixes.all(p, isCIDR(p)))'
                  - rule: '!has(self.country) || self.country.matches(''^[A-Za-z]{2}$'')'
                  - rule: '!has(self.hostnames) || size(self.hostnames) > 0'
                  - rule: '!has(self.ttl) || self.ttl >= 1'
                maxItems: 100
                type: array
              install:
                default: false
                description: Off, the list is counted and the kernel left alone.
                type: boolean
              nodes:
                description: The exit nodes, by their Kubernetes `Node` names.
                items:
                  maxLength: 253
                  type: string
                maxItems: 100
                type: array
                x-kubernetes-list-type: set
              ttl:
                default: 86400
                description: |-
                  Seconds an answer holds before it is resolved again, unless its source says otherwise or it
                  is a host's, whose records' own TTL counts within it.
                format: uint32
                minimum: 0.0
                type: integer
            required:
            - include
            - nodes
            type: object
            x-kubernetes-validations:
            - rule: size(self.nodes) > 0
            - rule: size(self.include) > 0
            - rule: self.ttl >= 1
          status:
            description: Each node's account, written by that node alone through server-side apply.
            nullable: true
            properties:
              nodes:
                default: []
                items:
                  properties:
                    conditions:
                      default: []
                      items:
                        description: Condition contains details for one aspect of the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: message is a human readable message indicating details about the transition. This may be an empty string.
                            type: string
                          observedGeneration:
                            description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                            format: int64
                            type: integer
                          reason:
                            description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                            type: string
                          status:
                            description: status of the condition, one of True, False, Unknown.
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      maxItems: 8
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    node:
                      maxLength: 253
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    prefixes:
                      properties:
                        ipv4:
                          format: uint32
                          minimum: 0.0
                          type: integer
                        ipv6:
                          format: uint32
                          minimum: 0.0
                          type: integer
                      required:
                      - ipv4
                      - ipv6
                      type: object
                    resolvedAt:
                      description: When the list was last resolved.
                      format: date-time
                      type: string
                    sources:
                      default: []
                      description: Each source of the spec, in its order.
                      items:
                        description: One source of the spec as this node last asked it.
                        properties:
                          error:
                            description: The first failure of its queries, each kept until that query answers.
                            nullable: true
                            type: string
                          index:
                            description: Its index in `include` or `exclude`.
                            format: uint32
                            minimum: 0.0
                            type: integer
                          label:
                            maxLength: 63
                            nullable: true
                            type: string
                          place:
                            description: Whether a source is of `include` or of `exclude`.
                            enum:
                            - include
                            - exclude
                            type: string
                          prefixes:
                            description: The distinct networks its answers gave, host bits cleared, before composing.
                            properties:
                              ipv4:
                                format: uint32
                                minimum: 0.0
                                type: integer
                              ipv6:
                                format: uint32
                                minimum: 0.0
                                type: integer
                            required:
                            - ipv4
                            - ipv6
                            type: object
                          resolvedAt:
                            description: |-
                              When the answer that expires first came, which need not be the oldest; absent until each of
                              its queries has answered.
                            format: date-time
                            type: string
                          ttl:
                            description: |-
                              Seconds that answer holds, so the source is next asked at `resolvedAt` plus this: the
                              source's own `ttl` if it has one, else the list's, or for a host its records' TTL within the
                              list's and at least 60 s.
                            format: uint32
                            minimum: 0.0
                            nullable: true
                            type: integer
                        required:
                        - index
                        - place
                        - prefixes
                        type: object
                      maxItems: 200
                      type: array
                  required:
                  - node
                  - observedGeneration
                  - prefixes
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - node
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        title: Egress
        type: object
    served: true
    storage: true
    subresources:
      status: {}
