# Pull requests and pushes run the checks; only a merged release PR is built, in its own run, and
# released as an image.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "29 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v4.0.2

  # What deploy/ holds is what the types print.
  crd:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: compare
        run: cargo run --locked --quiet -- crd | diff -u deploy/egress-crd.yaml -

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v4.0.2

  build:
    needs: [release-commit, checks, crd]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/rust-build.yml@v4.0.2
    with:
      binaries: egress

  image:
    needs: build
    uses: slipmesh/.github/.github/workflows/image.yml@v4.0.2
    permissions:
      contents: read
      packages: write

  # Builds the image from placeholders and pushes nothing, so a Dockerfile the release build
  # would fail on fails here.
  image-check:
    if: github.event_name == 'pull_request'
    uses: slipmesh/.github/.github/workflows/image.yml@v4.0.2
    permissions:
      contents: read
      packages: write
    with:
      push: false
      binaries: egress

  promote:
    needs: [release-commit, image]
    uses: slipmesh/.github/.github/workflows/promote.yml@v4.0.2
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}

  tag:
    needs: [release-commit, promote]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v4.0.2
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v4.0.2
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ needs.release-commit.outputs.latest == 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
