# An example list; every network, number and name is reserved for documentation.
apiVersion: slipmesh.net/v1alpha1
kind: Egress
metadata:
  name: example
spec:
  nodes: [node-a]
  ttl: 86400
  install: false
  via:
    ipv4: {gateway: 192.0.2.1}
  include:
    - {label: example, asns: [AS64496]}
    - {prefixes: [192.0.2.0/24, 2001:db8::/32]}
    - {country: XX}
    - {hostnames: [example.com], ttl: 300}
  exclude:
    - {prefixes: [192.0.2.128/25]}
